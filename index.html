:root{
  --morado:#8D5FA3;--rosa:#E980A7;--aqua:#7BC6BB;--coral:#DA7467;--lavanda:#B3B3DA;
  --ciruela:#594068;--noche:#3B2845;--abismo:#1E1424;--crema:#F0EFDE;--marfil:#F8F6E0;--hueso:#FBFAF5;
  --arena:#E7E5D5;--gris:#8A8494;--ln:#ECE8E0;
  --font:'Poppins','Montserrat',Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --cw:232px;--ch:106px;--av:22px;--mid:75px;--sp:56px;--line:#D3CCDD;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-weight:500;color:var(--ciruela);background:linear-gradient(135deg,#EFEBDA 0%,#F5F3E8 55%,#FBFAF5 100%);
  -webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--aqua);outline-offset:2px}
.app{height:100dvh;display:flex;flex-direction:column;gap:14px;padding:14px clamp(10px,1.6vw,22px) 14px}
.page{display:flex;flex-direction:column;gap:14px;flex:1;min-height:0}
.page[hidden]{display:none}

/* ---------- barra superior en píldoras ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{background:#fff;border-radius:999px;box-shadow:0 2px 10px rgba(89,64,104,.06);display:flex;align-items:center}
.brand{padding:12px 26px;transition:transform .35s var(--spring)}.brand:hover{transform:scale(1.03)}.brand svg{height:clamp(32px,3.2vw,44px);width:auto;display:block}
.tabs{padding:5px;gap:4px;position:relative}
.tabs button{border:0;background:none;border-radius:999px;padding:9px 20px;font-size:13px;font-weight:500;color:var(--ciruela);position:relative;z-index:1;transition:color .3s}
.tabs button.on{color:#fff}
.tabs .thumb{position:absolute;top:5px;bottom:5px;border-radius:999px;background:var(--noche);transition:left .45s var(--ease),width .45s var(--ease)}
.period{padding:11px 18px;font-size:12.5px;gap:8px;color:var(--ciruela)}
.period i{width:8px;height:8px;border-radius:50%;background:var(--rosa);box-shadow:0 0 0 0 rgba(233,128,167,.5);animation:latido 2.4s infinite}
@keyframes latido{70%{box-shadow:0 0 0 8px rgba(233,128,167,0)}100%{box-shadow:0 0 0 0 rgba(233,128,167,0)}}

/* ---------- hero ---------- */
.hero{display:flex;justify-content:space-between;align-items:center;gap:14px 30px;flex-wrap:wrap;padding:0 8px}
.hero h1{margin:0;font-size:clamp(36px,4.6vw,64px);font-weight:800;color:var(--morado);line-height:1;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--rosa)}
.hero p{margin:10px 0 0;font-size:13.5px;max-width:560px;line-height:1.5;color:var(--ciruela);font-weight:400}
.hero p b{font-weight:700;color:var(--noche)}
.figs{display:flex;gap:10px}
.fig{border:0;background:#fff;text-align:left;padding:10px 16px 11px;border-radius:18px;min-width:118px;box-shadow:0 2px 10px rgba(89,64,104,.06);transition:transform .3s var(--ease),box-shadow .3s}
.fig:hover{transform:translateY(-4px);box-shadow:0 12px 24px rgba(89,64,104,.12)}
.fig small{display:block;font-size:10.5px;color:var(--gris);font-weight:500;white-space:nowrap}
.fig b{display:block;font-size:clamp(20px,1.8vw,26px);font-weight:700;margin:1px 0 4px;color:var(--noche);letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:999px}
.chip.m{background:#EFE6F3;color:var(--morado)}.chip.a{background:#E2F3F0;color:#3E8F84}.chip.r{background:#FBE3EC;color:#C24F7B}
.chip.n{background:var(--noche);color:#fff}

/* ---------- lienzo ---------- */
.stage{position:relative;flex:1;min-height:420px;border-radius:28px;background:var(--hueso);overflow:hidden;
  box-shadow:0 2px 14px rgba(89,64,104,.06)}
.canvas{position:absolute;inset:0;cursor:grab;touch-action:none;
  background-image:radial-gradient(rgba(141,95,163,.12) 1px,transparent 1.3px);background-size:24px 24px}
.canvas.drag{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;padding:40px 80px 160px;will-change:transform}

/* buscador flotante */
.search{position:absolute;left:16px;top:16px;z-index:6;width:min(330px,calc(100% - 84px))}
.search label{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:999px;padding:0 16px;box-shadow:0 6px 20px rgba(89,64,104,.10);transition:box-shadow .3s}
.search label:focus-within{box-shadow:0 0 0 3px rgba(123,198,187,.5),0 6px 20px rgba(89,64,104,.12)}
.search svg{width:16px;height:16px;stroke:var(--morado);flex-shrink:0}
.search input{border:0;background:none;outline:none;font-family:inherit;font-size:13px;font-weight:500;color:var(--noche);padding:12px 0;width:100%}
.search input::placeholder{color:#A39BAD}
.res{margin-top:8px;background:#fff;border-radius:22px;box-shadow:0 18px 40px rgba(59,40,69,.20);padding:6px;max-height:min(380px,60vh);overflow:auto;
  transform-origin:top;animation:baja .28s var(--ease)}
.res[hidden]{display:none}
.res button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:16px;
  animation:sube .3s var(--ease) backwards;animation-delay:calc(var(--i)*22ms)}
.res button:hover,.res button.act{background:#F4EFF6}
.res b{display:block;font-size:12.5px;font-weight:600;color:var(--noche);line-height:1.2}
.res small{font-size:10.5px;color:var(--gris)}
.res .none{padding:14px;font-size:12px;color:var(--gris)}
.home{position:absolute;right:16px;top:16px;z-index:6;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.86);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 20px rgba(89,64,104,.10);display:grid;place-items:center;transition:transform .3s var(--spring),background .2s}
.home:hover{transform:scale(1.08) rotate(-8deg);background:#fff}
.home svg{width:18px;height:18px;stroke:var(--morado);fill:none;stroke-width:2.2}

/* selector flotante de ramas */
.dock{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:6;max-width:calc(100% - 24px);
  background:var(--noche);border-radius:999px;padding:5px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;
  box-shadow:0 14px 30px rgba(30,20,36,.30)}
.dock::-webkit-scrollbar{display:none}
.dock .thumb{position:absolute;top:5px;bottom:5px;border-radius:999px;background:#fff;transition:left .45s var(--ease),width .45s var(--ease);z-index:0}
.dock button{position:relative;z-index:1;border:0;background:none;color:var(--crema);font-size:12px;font-weight:500;padding:8px 14px;border-radius:999px;
  white-space:nowrap;display:inline-flex;align-items:center;gap:7px;transition:color .3s}
.dock button i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--crema));box-shadow:0 0 0 1.5px rgba(240,239,222,.55)}
.dock button.on{color:var(--noche)}
.dock button:not(.on):hover{color:#fff}

/* ---------- tarjetas del organigrama ---------- */
.nd{position:relative;display:flex;flex-direction:column;align-items:center}
.card{position:relative;z-index:2;width:var(--cw);height:var(--ch);margin-top:var(--av);background:#fff;border-radius:20px;
  box-shadow:0 4px 16px rgba(89,64,104,.08);padding:28px 14px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;
  cursor:pointer;transition:transform .35s var(--ease),box-shadow .35s var(--ease),opacity .4s,filter .4s}
.card:hover{transform:translateY(-5px);box-shadow:0 16px 30px rgba(89,64,104,.16)}
.av{position:absolute;top:calc(var(--av) * -1);left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;letter-spacing:.3px;
  background:linear-gradient(140deg,var(--b,#8D5FA3),color-mix(in srgb,var(--b,#8D5FA3) 55%,#fff));
  box-shadow:0 0 0 4px #fff,0 6px 14px rgba(89,64,104,.18);transition:transform .45s var(--spring)}
.card:hover .av{transform:translateX(-50%) scale(1.1) rotate(-6deg)}
.av svg{width:20px;height:20px}
.nm{font-size:12.4px;font-weight:600;color:var(--noche);line-height:1.22;max-width:100%;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.pu{font-size:10.2px;font-weight:500;color:var(--gris);line-height:1.3;margin-top:2px;max-width:100%;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ft{margin-top:auto;width:100%;display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--ciruela);font-weight:500}
.ft span{display:inline-flex;align-items:center;gap:4px}
.ft svg{width:12px;height:12px;fill:var(--b,var(--morado))}
.ft.c{justify-content:center}
.suc{font-size:9.5px;font-weight:600;color:var(--b,var(--morado));background:color-mix(in srgb,var(--b,#8D5FA3) 11%,#fff);padding:2px 10px;border-radius:999px}
.card.dg .av{background:linear-gradient(140deg,var(--morado),var(--rosa))}
.card.root{background:linear-gradient(45deg,#240137 0%,#31054E 60%,#470C58 100%);color:var(--crema)}
.card.root .nm{color:var(--crema);font-weight:800;letter-spacing:.8px;font-size:13px}
.card.root .pu{color:var(--aqua)}
.card.root .av{background:linear-gradient(140deg,#470C58,#8D5FA3)}
.card.root .ft{justify-content:center;gap:14px;color:var(--crema)}.card.root .ft svg{fill:var(--aqua)}
.card.vac{background:repeating-linear-gradient(135deg,#FFFFFF 0 7px,#FBF6F8 7px 9px);box-shadow:0 0 0 1.5px #F2C3D5 inset,0 4px 16px rgba(89,64,104,.06)}
.card.vac .av{background:linear-gradient(140deg,var(--rosa),#F6C1D4)}
.card.vac .nm{color:#C24F7B}
.rt{font-size:9px;color:var(--gris);margin-top:1px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt b{color:var(--ciruela);font-weight:600}
.card.sel{box-shadow:0 0 0 2.5px var(--aqua),0 16px 30px rgba(89,64,104,.18)}
.card.hl::after{content:"";position:absolute;inset:-6px;border-radius:26px;border:2.5px solid var(--rosa);animation:anillo 1.3s var(--ease) 3;pointer-events:none}
@keyframes anillo{0%{opacity:1;transform:scale(.96)}100%{opacity:0;transform:scale(1.12)}}
.dim>.card,.dim>.grpc{opacity:.28;filter:grayscale(.7)}
.dim>.card:hover{opacity:.75}

.tg{position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;
  border:0;background:#fff;display:grid;place-items:center;padding:0;z-index:3;box-shadow:0 0 0 1.5px #E4DEEA,0 3px 8px rgba(89,64,104,.14);
  transition:background .25s,box-shadow .25s,transform .35s var(--spring)}
.tg svg{width:12px;height:12px;stroke:var(--morado);stroke-width:2.6;fill:none;transition:transform .4s var(--spring)}
.tg:hover{background:var(--noche);box-shadow:0 0 0 1.5px var(--noche);transform:translateX(-50%) scale(1.15)}.tg:hover svg{stroke:#fff}
.tg[aria-expanded="true"] svg{transform:rotate(180deg)}

/* conectores */
.kids{display:flex;flex-direction:column;align-items:center;padding-top:13px}
.kids.out,.team.out{animation:sale .2s ease forwards}
.team{display:flex;flex-direction:column;align-items:center}
.team>.kids{padding-top:0}
.vline.lead{width:2.4px;height:34px;background:var(--b);border-radius:2px}
.tpill{display:inline-flex;align-items:center;gap:9px;background:#fff;border-radius:999px;padding:5px 6px 5px 5px;font-size:11.5px;color:var(--ciruela);white-space:nowrap;
  box-shadow:0 0 0 1.8px var(--b) inset,0 10px 22px rgba(89,64,104,.12);animation:entra .55s var(--spring) backwards}
.tpill b{color:var(--noche);font-weight:700}
.tpill .mini{width:26px;height:26px;font-size:9.5px}.tpill .mini svg{width:14px;height:14px}
.tpill em{font-style:normal;font-size:10.5px;font-weight:700;color:#fff;background:var(--b);border-radius:999px;padding:3px 9px}
.cell>.nd.leadnd::before{background:var(--b);height:2.4px;z-index:1}
.card.lead{background:linear-gradient(150deg,var(--b,#8D5FA3) 0%,color-mix(in srgb,var(--b,#8D5FA3) 62%,#3B2845) 100%);
  box-shadow:0 16px 32px color-mix(in srgb,var(--b,#8D5FA3) 38%,transparent);animation:liderPop .6s var(--spring)}
.card.lead .nm,.card.lead .ft,.card.lead .rt b{color:#fff}.card.lead .pu,.card.lead .rt{color:rgba(255,255,255,.82)}
.card.lead .ft svg{fill:#fff}
.card.lead .av{background:#fff;color:var(--b,#8D5FA3);box-shadow:0 0 0 4px color-mix(in srgb,var(--b,#8D5FA3) 28%,#fff),0 8px 16px rgba(30,20,36,.2)}
.card.lead .av svg{fill:var(--b,#8D5FA3)}
.card.vac.lead{--b:#E980A7}.card.dg.lead{--b:#8D5FA3}
.card.lead .tg{background:var(--noche);box-shadow:0 0 0 2px #fff,0 3px 8px rgba(30,20,36,.25)}.card.lead .tg svg{stroke:#fff}
@keyframes liderPop{0%{transform:scale(.94)}60%{transform:scale(1.04)}100%{transform:none}}
.vline{width:1.6px;height:26px;background:var(--line);transform-origin:top}
.grid{display:grid;grid-template-columns:1fr var(--sp) 1fr}
.cell{display:flex;align-items:flex-start;padding-bottom:20px}
.cell.l{justify-content:flex-end}.cell.r{justify-content:flex-start}
.cell>.nd::before,.cell>.grp::before{content:"";position:absolute;top:var(--mid);height:1.6px;background:var(--line);z-index:0}
.cell.l>.nd::before,.cell.l>.grp::before{left:50%;right:calc(var(--sp) / -2)}
.cell.r>.nd::before,.cell.r>.grp::before{right:50%;left:calc(var(--sp) / -2)}
.spn{position:relative}
.spn::before{content:"";position:absolute;left:50%;transform:translateX(-50%);top:0;bottom:0;width:1.6px;background:var(--line);transform-origin:top}
.spn.last::before{bottom:auto;height:var(--mid)}

/* grupos de puesto */
.grp{position:relative;display:flex;flex-direction:column;align-items:center}
.grpc{position:relative;z-index:2;width:var(--cw);height:var(--ch);margin-top:var(--av);border-radius:20px;background:#fff;
  box-shadow:0 0 0 1.5px color-mix(in srgb,var(--b,#B3B3DA) 35%,#fff) inset,0 4px 16px rgba(89,64,104,.06);
  padding:28px 14px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;
  transition:transform .35s var(--ease),box-shadow .35s var(--ease),opacity .4s,filter .4s}
.grpc:hover{transform:translateY(-5px)}
.grpc .av{background:#fff;color:var(--b,var(--morado));box-shadow:0 0 0 4px var(--hueso),0 0 0 5.5px color-mix(in srgb,var(--b,#B3B3DA) 35%,#fff)}
.grpc .av svg{fill:var(--b,var(--morado))}
.grpc .gn{margin-top:auto;display:flex;align-items:baseline;gap:6px;justify-content:center}
.grpc .gn b{font-size:22px;font-weight:700;color:var(--b,var(--morado));line-height:1;letter-spacing:-.02em}
.grpc .gn span{font-size:10px;color:var(--gris)}
.glist{display:flex;flex-direction:column;align-items:center;padding-top:13px}
.gpanel{width:var(--cw);background:#fff;border-radius:20px;box-shadow:0 4px 16px rgba(89,64,104,.08);padding:6px}
.gpanel button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;text-align:left;padding:6px 8px;border-radius:14px;
  animation:sube .35s var(--ease) backwards;animation-delay:calc(var(--i)*18ms)}
.gpanel button:hover{background:#F4EFF6}
.gpanel .mini{width:26px;height:26px;font-size:9.5px}
.gpanel b{display:block;font-size:10.8px;font-weight:600;color:var(--noche);line-height:1.2}
.gpanel small{font-size:9.2px;color:var(--gris)}
.gpanel button.hl{animation:filaHl 1.1s ease 3}
@keyframes filaHl{50%{background:#FBE3EC}}
.mini{flex-shrink:0;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:10.5px;font-weight:700;
  background:linear-gradient(140deg,var(--b,#8D5FA3),color-mix(in srgb,var(--b,#8D5FA3) 55%,#fff))}

/* ---------- hoja de detalle ---------- */
.ov{position:fixed;inset:0;z-index:40;background:rgba(30,20,36,.32);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;top:14px;right:14px;bottom:14px;width:min(470px,calc(100% - 28px));background:var(--hueso);border-radius:28px;
  box-shadow:0 30px 60px rgba(30,20,36,.30);display:flex;flex-direction:column;overflow:hidden;
  transform:translateX(40px) scale(.97);opacity:0;transition:transform .5s var(--ease),opacity .35s}
.ov.on .sheet{transform:none;opacity:1}
.sh{padding:22px 24px 0;position:relative}
.sh .x{position:absolute;right:18px;top:18px;width:36px;height:36px;border-radius:50%;border:0;background:var(--noche);color:#fff;
  font-size:18px;line-height:1;display:grid;place-items:center;transition:transform .35s var(--spring)}
.sh .x:hover{transform:rotate(90deg) scale(1.06)}
.sh .ey{font-size:11px;color:var(--gris);font-weight:500;padding-right:50px}
.sh .who{display:flex;align-items:center;gap:14px;margin-top:12px}
.sh .who .mini{width:56px;height:56px;font-size:17px;box-shadow:0 8px 18px rgba(89,64,104,.2)}
.sh h2{margin:0;font-size:22px;font-weight:700;color:var(--noche);line-height:1.15;letter-spacing:-.01em}
.sh .pt{display:inline-block;margin-top:6px;font-size:10.5px;font-weight:600;color:var(--morado);border:1.5px solid var(--morado);border-radius:999px;padding:3px 11px}
.sb{overflow:auto;padding:18px 24px 26px;flex:1}
.sb>*{animation:sube .45s var(--ease) backwards;animation-delay:calc(var(--i,0)*60ms)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:#fff;border-radius:18px;padding:10px 12px;min-width:0}
.tile b{display:block;font-size:22px;font-weight:600;color:var(--noche);letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:9.8px;color:var(--gris)}
.tile.hot{background:linear-gradient(160deg,#A57BBA,#8D5FA3 55%,#6F4785);position:relative;overflow:hidden}
.tile.hot::after{content:"";position:absolute;right:-18px;top:-18px;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.14)}
.tile.hot b,.tile.hot span{color:#fff}
.find{font-size:12.5px;line-height:1.55;margin:14px 0 0;color:var(--ciruela);font-weight:400}
.find b{font-weight:700;color:var(--noche)}
.sec{font-size:13.5px;font-weight:600;color:var(--noche);margin:20px 0 10px;display:flex;justify-content:space-between;align-items:center}
.sec small{font-size:10.5px;color:var(--gris);font-weight:500}
.row{display:flex;align-items:center;gap:10px;width:100%;border:0;background:#fff;border-radius:18px;padding:8px 8px 8px 10px;margin-bottom:6px;text-align:left;
  transition:transform .3s var(--ease),box-shadow .3s;animation:sube .4s var(--ease) backwards;animation-delay:calc(var(--j,0)*28ms)}
.row:hover{transform:translateX(3px);box-shadow:0 6px 16px rgba(89,64,104,.10)}
.row .tx{flex:1;min-width:0}
.row b{display:block;font-size:12px;font-weight:600;color:var(--noche);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{display:block;font-size:10px;color:var(--gris);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row em{font-style:normal;font-size:10.5px;font-weight:600;color:var(--morado);background:#EFE6F3;border-radius:999px;padding:2px 9px;white-space:nowrap}
.arw{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--noche);display:grid;place-items:center;transition:transform .35s var(--spring)}
.arw svg{width:13px;height:13px;stroke:#fff;stroke-width:2.4;fill:none}
.row:hover .arw{transform:rotate(-45deg)}
.steps{display:flex;flex-direction:column;position:relative;padding-left:4px}
.steps button{border:0;background:none;text-align:left;display:flex;gap:12px;align-items:flex-start;padding:4px 0 10px;position:relative}
.steps button::before{content:"";position:absolute;left:6px;top:16px;bottom:-4px;width:1.6px;background:var(--line)}
.steps button:last-child::before{display:none}
.steps i{flex-shrink:0;width:14px;height:14px;border-radius:50%;border:2px solid var(--morado);background:#fff;margin-top:2px;position:relative;z-index:1}
.steps button.me i{background:var(--rosa);border-color:var(--rosa)}
.steps b{display:block;font-size:11.5px;font-weight:600;color:var(--noche);line-height:1.2}
.steps small{font-size:9.8px;color:var(--gris)}
.steps button:hover b{color:var(--morado)}
.bars>div{display:grid;grid-template-columns:clamp(6rem,42%,11rem) 1fr 34px;gap:10px;align-items:center;font-size:10.8px;margin-bottom:8px}
.bars span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars i{display:block;height:12px;border-radius:999px;background:repeating-linear-gradient(135deg,#F2EFF4 0 4px,#E6E1EA 4px 6px);overflow:hidden}
.bars u{display:block;height:100%;border-radius:999px;background:var(--c,var(--morado));transform-origin:left;animation:crece .9s var(--ease) backwards;animation-delay:calc(var(--j)*50ms + .15s)}
.bars b{text-align:right;font-weight:600;color:var(--noche);font-variant-numeric:tabular-nums}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:0;border-radius:999px;padding:10px 18px;font-size:12px;font-weight:600;background:#fff;color:var(--noche);box-shadow:0 0 0 1.5px #E4DEEA inset;
  transition:transform .3s var(--spring),background .2s}
.btn:hover{transform:translateY(-2px)}
.btn.pri{background:var(--morado);color:#fff;box-shadow:none}.btn.pri:hover{background:var(--rosa)}
.note{font-size:11px;line-height:1.5;color:var(--ciruela);background:#fff;border-radius:16px;padding:12px 14px;font-weight:400}

/* tooltip */
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--noche);color:#fff;border-radius:14px;padding:8px 12px;font-size:11px;line-height:1.4;
  max-width:240px;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s}
.tip.on{opacity:1;transform:none}
.tip small{display:block;color:#C9BFD3;font-size:10px}
.tip em{display:block;font-style:normal;color:var(--aqua);font-size:10px;margin-top:3px}


@keyframes sube{from{opacity:0;transform:translateY(12px)}}
@keyframes baja{from{opacity:0;transform:translateY(-6px) scaleY(.96)}}
@keyframes sale{to{opacity:0;transform:translateY(-10px)}}
@keyframes crece{from{transform:scaleX(0)}}
@keyframes entra{from{opacity:0;transform:translateY(16px) scale(.94)}}
@keyframes linea{from{transform:scaleY(0)}}
@keyframes lineaH{from{opacity:0}}
.fresh>.card,.fresh>.grpc{animation:entra .55s var(--ease) backwards;animation-delay:calc(var(--i)*45ms + 80ms)}
.kids.enter>.vline{animation:linea .3s var(--ease) backwards}
.kids.enter>.grid>.spn::before{animation:linea .45s var(--ease) backwards;animation-delay:.1s}
.kids.enter>.grid>.cell>*::before{animation:lineaH .4s ease backwards;animation-delay:calc(var(--i)*45ms + 120ms)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@media (max-width:900px){
  .tiles{grid-template-columns:repeat(2,1fr)}
}
@media (max-height:640px) and (min-width:701px){
  .app{height:auto;min-height:100dvh;gap:10px;padding-top:10px}.stage{flex:none;height:92dvh}
  .brand{padding:9px 20px}.brand svg{height:34px}.hero h1{font-size:clamp(34px,4vw,52px)}
}
@media (max-width:700px){
  .app{height:auto;min-height:100dvh;padding:10px}
  .top{flex-wrap:wrap}.brand{padding:9px 16px}.brand svg{height:30px}.period{display:none}
  .tabs button{padding:8px 13px;font-size:12px}
  .hero{padding:0 4px}.hero p{font-size:12.5px}.figs{width:100%;justify-content:space-between;gap:8px}
  .fig{min-width:0;flex:1;padding:8px 10px}.fig small{font-size:9.5px}.fig b{font-size:20px}.chip{font-size:8.5px;padding:2px 7px;white-space:nowrap}
  .hero h1{font-size:34px}
  .stage{flex:none;height:76dvh}
  .sheet{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:84dvh;transform:translateY(40px)}
}

/* ---------- landing ---------- */
.land{position:fixed;inset:0;z-index:60;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 45%,#FBFAF5 0%,#F5F3E8 45%,#ECE8D8 100%);
  transition:opacity .8s var(--ease),transform .9s var(--ease),filter .8s}
.land.leave{opacity:0;transform:scale(1.06);filter:blur(6px);pointer-events:none}
.land[hidden]{display:none}
.lines{position:absolute;inset:0;width:100%;height:100%}
.lines path{fill:none;stroke-linecap:round}
.lines .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:trazo 2.6s var(--ease) forwards;animation-delay:var(--d)}
.lines .fl{stroke-dasharray:.012 .05;animation:flujo var(--t) linear infinite;opacity:0;animation-delay:var(--d);animation-fill-mode:both}
.lines g.wv{animation:ola var(--t) ease-in-out infinite alternate;transform-box:view-box;transform-origin:center}
.lines .orb{fill:none;stroke-dasharray:3 9;transform-box:view-box;transform-origin:720px 450px;animation:gira var(--t) linear infinite, aparece 2s ease backwards}
.lines .st{animation:brilla var(--t) ease-in-out infinite;animation-delay:var(--d)}
@keyframes trazo{to{stroke-dashoffset:0}}
@keyframes flujo{0%{stroke-dashoffset:0;opacity:.9}100%{stroke-dashoffset:-1.24;opacity:.9}}
@keyframes ola{from{transform:translateY(-10px)}to{transform:translateY(12px)}}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes aparece{from{opacity:0}}
@keyframes brilla{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:.9;transform:scale(1)}}
.lcenter{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:0}
.lgo{width:min(620px,82vw);height:auto;overflow:visible;transition:transform 1.1s var(--ease)}
.lgo .pet{transform-box:view-box;transform-origin:200px 200px;animation:florece 1s var(--spring) backwards;animation-delay:calc(var(--i)*130ms + .35s)}
.lgo .gl{fill-opacity:0;stroke-width:1.8;stroke-dasharray:1 1;stroke-dashoffset:1;stroke-linejoin:round;
  animation:escribe 1s var(--ease) forwards,rellena .6s ease forwards,sinTrazo .5s ease forwards;
  animation-delay:calc(var(--i)*95ms + 1.15s),calc(var(--i)*95ms + 1.75s),calc(var(--i)*95ms + 2.3s)}
@keyframes florece{from{opacity:0;transform:scale(0) rotate(-70deg)}}
@keyframes escribe{to{stroke-dashoffset:0}}
@keyframes rellena{to{fill-opacity:1}}
@keyframes sinTrazo{to{stroke-opacity:0}}
.halo{position:absolute;left:50%;top:50%;width:min(760px,110vw);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(251,250,245,.94) 0%,rgba(251,250,245,.82) 30%,rgba(233,128,167,.07) 46%,transparent 66%);z-index:1;animation:respira 6s ease-in-out infinite;pointer-events:none}
@keyframes respira{50%{transform:translate(-50%,-50%) scale(1.08)}}
.land.up .lgo{transform:translateY(-6vh) scale(.72)}
.cta{display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:-2vh;pointer-events:none}
.cta p{margin:0;font-size:13px;color:var(--ciruela);font-weight:500;letter-spacing:.3px;opacity:0;transform:translateY(14px);transition:all .7s var(--ease) .15s}
.cta p b{color:var(--rosa);font-weight:600}
.cta .bts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.cta button{border:0;border-radius:999px;padding:15px 28px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:10px;
  opacity:0;transform:translateY(20px) scale(.96);transition:opacity .7s var(--ease),transform .7s var(--spring),background .25s,box-shadow .25s}
.cta .b1{background:var(--morado);color:#fff;box-shadow:0 14px 30px rgba(141,95,163,.35);transition-delay:.3s}
.cta .b2{background:#fff;color:var(--noche);box-shadow:0 0 0 1.5px #E4DEEA inset,0 10px 24px rgba(89,64,104,.10);transition-delay:.42s}
.cta .b1:hover{background:var(--rosa);box-shadow:0 18px 34px rgba(233,128,167,.4)}
.cta .b2:hover{box-shadow:0 0 0 1.5px var(--morado) inset,0 14px 28px rgba(89,64,104,.14)}
.cta .ar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.2);transition:transform .4s var(--spring)}
.cta .b2 .ar{background:var(--noche)}
.cta button:hover .ar{transform:translateX(4px) rotate(-45deg)}
.cta .ar svg{width:13px;height:13px;stroke:#fff;stroke-width:2.4;fill:none}
.land.up .cta{pointer-events:auto}
.land.up .cta p,.land.up .cta button{opacity:1;transform:none}
.skip{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--gris);z-index:3;transition:opacity .5s;font-weight:400}
.land.up .skip{opacity:0}
.land.fast .pet,.land.fast .gl{animation:none!important;fill-opacity:1;stroke-opacity:0;opacity:1}
.app{transition:opacity .8s var(--ease) .1s,transform .9s var(--ease) .1s}
.app.wait{opacity:0;transform:translateY(24px)}
@media (prefers-reduced-motion: reduce){.lgo .gl{fill-opacity:1;stroke-opacity:0}}
@media (max-width:700px){.land.up .lgo{transform:translateY(-4vh) scale(.86)}.cta button{padding:13px 22px;font-size:13px}}

/* =========== capa de elegancia =========== */
:root{--line:#DCD5E3;--hair:rgba(89,64,104,.10)}
body{background:radial-gradient(140% 100% at 0% 0%,#F6F3EA 0%,#F3F0E6 50%,#EEEADC 100%)}
.pill{box-shadow:none;background:transparent}
.brand{padding:4px 2px}.brand:hover{transform:none;opacity:.85}
.period{border:1px solid var(--hair);background:rgba(255,255,255,.45);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ciruela);padding:9px 18px}
.period i{width:6px;height:6px}
.hero{align-items:flex-end;padding:2px 10px 4px}
.kick{display:block;font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--gris);font-weight:500;margin-bottom:8px}
.hero h1{font-weight:800;letter-spacing:-.035em;color:var(--noche)}
.hero h1 .lt{font-weight:400;color:var(--ciruela);letter-spacing:-.03em}
.hero h1 em{background:linear-gradient(100deg,#8D5FA3 0%,#B56FA4 50%,#E980A7 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.04em}
.figs{gap:0}
.fig{background:transparent;box-shadow:none;border-radius:0;padding:4px 26px;min-width:0;border-left:1px solid var(--hair)}
.fig:first-child{border-left:0}
.fig:hover{transform:none;box-shadow:none}
.fig:hover b{color:var(--morado)}
.fig small{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gris)}
.fig b{font-size:clamp(24px,2.2vw,32px);font-weight:400;letter-spacing:-.03em;margin:2px 0 1px;transition:color .3s}
.fig .sub{font-size:10.5px;color:var(--gris);font-weight:400}
.fig .sub.r{color:#C24F7B}

.stage{background:rgba(253,252,248,.75);box-shadow:0 0 0 1px var(--hair),0 30px 60px -30px rgba(59,40,69,.18);border-radius:30px}
.canvas{background-image:radial-gradient(rgba(141,95,163,.07) 1px,transparent 1.2px);background-size:28px 28px}
.search label{background:rgba(255,255,255,.7);box-shadow:0 0 0 1px var(--hair);border-radius:999px}
.search label:focus-within{box-shadow:0 0 0 1px var(--morado),0 8px 24px rgba(89,64,104,.10)}
.search input{font-size:12.5px;font-weight:400}
.home{background:rgba(255,255,255,.7);box-shadow:0 0 0 1px var(--hair)}
.home svg{stroke-width:1.6}
.dock{background:rgba(59,40,69,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:4px;box-shadow:0 18px 40px -12px rgba(30,20,36,.45)}
.dock button{font-size:11px;letter-spacing:.04em;font-weight:400;padding:8px 14px}
.dock button.on{font-weight:600}
.dock .thumb{top:4px;bottom:4px}

/* tarjetas */
.card,.grpc{border-radius:18px;box-shadow:0 0 0 1px var(--hair),0 10px 24px -14px rgba(59,40,69,.22);background:#fff}
.card:hover,.grpc:hover{transform:translateY(-3px);box-shadow:0 0 0 1px rgba(141,95,163,.22),0 22px 36px -16px rgba(59,40,69,.30)}
.av{width:42px;height:42px;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--b,#8D5FA3);
  background:#fff;box-shadow:0 0 0 1px color-mix(in srgb,var(--b,#8D5FA3) 45%,#fff),0 0 0 5px #fff,0 6px 14px -4px rgba(59,40,69,.25)}
.card:hover .av{transform:translateX(-50%) scale(1.06)}
.card.dg .av{background:#fff;color:var(--morado)}
.nm{font-size:12.2px;font-weight:600;color:var(--noche);letter-spacing:-.005em}
.pu{font-size:8.8px;letter-spacing:.12em;text-transform:uppercase;color:var(--gris);font-weight:500;margin-top:4px;line-height:1.45}
.ft{font-size:9.8px;color:var(--gris);font-weight:400;padding-top:7px;border-top:1px solid var(--hair)}
.ft svg{width:11px;height:11px;fill:color-mix(in srgb,var(--b,#8D5FA3) 70%,#fff)}
.ft.c{border-top:0}
.suc{background:transparent;color:var(--gris);font-weight:500;font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:0;
  display:inline-flex;align-items:center;gap:6px}
.suc::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--b,#8D5FA3)}
.tg{width:22px;height:22px;bottom:-11px;box-shadow:0 0 0 1px var(--line),0 2px 6px rgba(59,40,69,.10)}
.tg svg{width:10px;height:10px;stroke-width:2.2}
.card.root{background:linear-gradient(160deg,#2A0640 0%,#3B1253 55%,#4A1A5E 100%);box-shadow:0 22px 44px -18px rgba(36,1,55,.6)}
.card.root .av{background:linear-gradient(140deg,#470C58,#8D5FA3);box-shadow:0 0 0 1px rgba(255,255,255,.25),0 0 0 5px var(--hueso)}
.card.root .nm{font-size:11.5px;letter-spacing:.32em;font-weight:600}
.card.root .pu{color:#C9B6D6}
.card.root .ft{border-top-color:rgba(255,255,255,.12)}

/* líder: tono noche con acento de su dirección */
.card.lead{background:linear-gradient(165deg,#3B2845 0%,color-mix(in srgb,var(--b,#8D5FA3) 34%,#2A1B33) 100%);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--b,#8D5FA3) 55%,transparent),0 24px 40px -18px color-mix(in srgb,var(--b,#8D5FA3) 70%,#1E1424)}
.card.lead::after{content:"";position:absolute;left:22%;right:22%;bottom:0;height:2px;border-radius:2px;background:var(--b,#8D5FA3)}
.card.lead .nm{color:#FBFAF5}.card.lead .pu{color:rgba(240,239,222,.62)}
.card.lead .ft{color:rgba(240,239,222,.75);border-top-color:rgba(240,239,222,.12)}
.card.lead .ft svg{fill:var(--b,#8D5FA3)}
.card.lead .av{background:#3B2845;color:#fff;box-shadow:0 0 0 1.5px var(--b,#8D5FA3),0 0 0 5px var(--hueso),0 8px 18px -4px rgba(30,20,36,.4)}
.card.lead .av svg{fill:#fff}
.card.lead .tg{background:var(--b,#8D5FA3);box-shadow:0 0 0 3px var(--hueso)}
.card.lead .tg svg{stroke:#fff}
.card.lead .rt,.card.lead .rt b{color:rgba(240,239,222,.75)}
.cell>.nd.leadnd::before{height:1.5px}

/* vacantes y grupos */
.card.vac{background:linear-gradient(180deg,#FFFFFF 0%,#FDF6F9 100%);box-shadow:0 0 0 1px rgba(233,128,167,.35),0 10px 24px -14px rgba(194,79,123,.25)}
.card.vac .nm{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:#C24F7B}
.card.vac .av{color:#E980A7;background:#fff}.card.vac .av svg{fill:#E980A7}
.grpc .av{background:#fff;box-shadow:0 0 0 1px color-mix(in srgb,var(--b,#8D5FA3) 35%,#fff),0 0 0 5px #fff}
.grpc .gn b{font-weight:400;font-size:24px}
.grpc .gn span{letter-spacing:.12em;text-transform:uppercase;font-size:8.5px}
.gpanel{box-shadow:0 0 0 1px var(--hair),0 10px 24px -14px rgba(59,40,69,.22)}
.mini{font-weight:600;letter-spacing:.04em}

/* conectores más finos */
.vline,.spn::before,.cell>.nd::before,.cell>.grp::before{width:1px}
.cell>.nd::before,.cell>.grp::before{height:1px;width:auto}
.vline.lead{width:1.5px}

/* tooltip y hoja */
.tip{background:rgba(42,27,51,.94);backdrop-filter:blur(8px);border-radius:12px;font-weight:400}
.sheet{background:#FCFBF7;border-radius:30px;box-shadow:0 0 0 1px var(--hair),0 40px 80px -20px rgba(30,20,36,.45)}
.sh h2{font-weight:600;font-size:23px;letter-spacing:-.02em}
.sh .ey{letter-spacing:.2em;text-transform:uppercase;font-size:9.5px}
.sh .pt{border-width:1px;font-weight:500;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase}
.sh .x{width:34px;height:34px;font-weight:300}
.tile{background:#fff;box-shadow:0 0 0 1px var(--hair)}
.tile b{font-weight:400;font-size:24px}
.tile span{letter-spacing:.14em;text-transform:uppercase;font-size:8.5px}
.tile.hot{background:linear-gradient(160deg,#3B2845,#5A3D69);box-shadow:none}
.sec{font-weight:500;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gris);padding-bottom:8px;border-bottom:1px solid var(--hair)}
.row{background:#fff;box-shadow:0 0 0 1px var(--hair)}
.row:hover{box-shadow:0 0 0 1px rgba(141,95,163,.25),0 10px 20px -10px rgba(59,40,69,.25)}
.row em{background:transparent;color:var(--morado);font-weight:500;padding:0 4px}
.arw{width:26px;height:26px;background:transparent;box-shadow:0 0 0 1px var(--line)}
.arw svg{stroke:var(--noche);stroke-width:1.8}
.row:hover .arw{background:var(--noche)}.row:hover .arw svg{stroke:#fff}
.bars i{height:6px;background:#EEEAF1}
.btn{font-weight:500;letter-spacing:.04em}
.btn.pri{background:var(--noche)}.btn.pri:hover{background:var(--morado)}
.find{font-size:12.5px}

/* landing */
.cta p{letter-spacing:.24em;text-transform:uppercase;font-size:10.5px;color:var(--gris)}
.cta .b1{background:var(--noche);font-weight:500;letter-spacing:.03em;box-shadow:0 18px 36px -14px rgba(59,40,69,.55)}
.cta .b1:hover{background:var(--morado);box-shadow:0 18px 36px -12px rgba(141,95,163,.55)}
.cta .b2{background:rgba(255,255,255,.6);font-weight:500;letter-spacing:.03em;box-shadow:0 0 0 1px var(--line) inset}
.cta .b2:hover{background:#fff;box-shadow:0 0 0 1px var(--noche) inset}
.cta .b2 .ar{background:transparent;box-shadow:0 0 0 1px var(--line)}.cta .b2 .ar svg{stroke:var(--noche)}
.lines .ln{stroke-width:.9}

@media (max-width:700px){
  .fig{padding:4px 10px;flex:1}.fig b{font-size:22px}.fig small{font-size:7.5px;letter-spacing:.08em}.fig .sub{font-size:9.5px;white-space:nowrap}
  .kick{font-size:9px}
}

/* comité médico */
.card.com{background:linear-gradient(180deg,#FFFFFF 0%,#F0F9F7 100%);box-shadow:0 0 0 1px rgba(79,168,155,.45),0 12px 26px -14px rgba(79,168,155,.45)}
.card.com .av{color:#4FA89B;background:#fff}.card.com .av svg{fill:#4FA89B;width:18px;height:18px}
.card.com .kk{font-size:8.5px;letter-spacing:.28em;text-transform:uppercase;color:#4FA89B;font-weight:600;margin-bottom:1px}
.card.com .nm{font-size:13px}
.card.com .pu{text-transform:none;letter-spacing:.02em;font-size:10px;color:var(--ciruela)}
.card.com.lead{--b:#4FA89B;background:linear-gradient(165deg,#3B2845 0%,color-mix(in srgb,#4FA89B 34%,#2A1B33) 100%);box-shadow:0 0 0 1px rgba(79,168,155,.6),0 24px 40px -18px rgba(30,60,56,.7)}
.mini svg{width:15px;height:15px;fill:#fff}.sh .who .mini svg{width:22px;height:22px}
.card.com.lead .kk{color:#9FE0D6}.card.com.lead .av{background:#3B2845}.card.com.lead .av svg{fill:#fff}
.card.com.lead .pu{color:rgba(240,239,222,.75)}
</style>

  let upT=setTimeout(()=>land.classList.add('up'), reduce?0:4100);
  function skip(){ if(land.classList.contains('up')) return; clearTimeout(upT); land.classList.add('fast'); requestAnimationFrame(()=>land.classList.add('up')); }
  land.addEventListener('click',e=>{ if(!e.target.closest('button')) skip(); });
  addEventListener('keydown',e=>{ if(!land.hidden && !land.classList.contains('up')) skip(); });
  function enter(then){
    land.classList.add('leave');
    setTimeout(()=>{ land.hidden=true; app.classList.remove('wait'); setTimeout(()=>{ startOrg(); then&&then(); },250); }, 650);
  }
  document.getElementById('goOrg').onclick=()=>enter();
  document.getElementById('goSearch').onclick=()=>enter(()=>setTimeout(()=>qi.focus(),900));
  document.getElementById('toLanding').onclick=()=>{ closeSheet(); land.hidden=false; land.classList.add('fast','up'); app.classList.add('wait');
    requestAnimationFrame(()=>requestAnimationFrame(()=>land.classList.remove('leave'))); };
})();
</script>
</body>
</html>
